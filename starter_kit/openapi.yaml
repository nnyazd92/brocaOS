openapi: 3.0.0
info:
  title: BrocaAPI (Starter Kit)
  version: '0.1.0'
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        '200':
          description: OK
  /session:
    post:
      summary: Create or resume a session
      requestBody:
        required: true
      responses:
        '200':
          description: Session created
  /memory/query:
    post:
      summary: Query memory
      requestBody:
        required: true
      responses:
        '200':
          description: Query results
  /memory/upsert:
    post:
      summary: Upsert memory
      requestBody:
        required: true
      responses:
        '200':
          description: Upsert OK
  /actuator/request:
    post:
      summary: Request actuator action (may require approval)
      requestBody:
        required: true
      responses:
        '200':
          description: Request recorded
  /actuator/approve:
    post:
      summary: Approve actuator request
      requestBody:
        required: true
      responses:
        '200':
          description: Approved
