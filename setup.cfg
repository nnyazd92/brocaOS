[mutmut]
paths_to_mutate=broca/summarization/*.py broca/repl/session.py broca/repl/tool_status.py broca/repl/color_profile.py
tests_dirs=broca/tests
runner=python -m pytest broca/tests/test_summarizer*.py broca/tests/test_storage*.py broca/tests/test_session_message_validation.py broca/tests/test_session_message_filtering.py broca/tests/test_repl_terminal_output.py broca/tests/test_repl_colors.py -x -v

[coverage:run]
source = broca
branch = True
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

