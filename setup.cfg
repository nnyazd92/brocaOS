[mutmut]
paths_to_mutate =
    broca/memory/*.py
    broca/memory/**/*.py
    broca/summarization/*.py
    broca/repl/session.py
    broca/repl/tool_status.py
    broca/repl/color_profile.py
    broca/internal_sensing/*.py
    broca/web_api.py
    broca/world_state/formatter.py
    broca/summarization/prompt_builder.py
    broca/reasoning/z3_validator.py
tests_dirs = tests broca/tests
runner = python -m pytest --maxfail=1 --disable-warnings --cov=broca --cov-branch
use_coverage = True

[coverage:run]
source = broca
branch = True
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
