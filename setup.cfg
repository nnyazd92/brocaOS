[mutmut]
paths_to_mutate=broca/summarization/*.py
tests_dirs=broca/tests
runner=python -m pytest broca/tests/test_summarizer*.py broca/tests/test_storage*.py -x -v

[coverage:run]
source = broca/summarization
branch = True
omit = */tests/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

