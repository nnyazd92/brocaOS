[mutmut]
paths_to_mutate =
    # Targeted mutation scope (kept intentionally small to keep mutmut runtimes reasonable)
    broca/internal_sensing/epistemic_bridge.py
    broca/reasoning/rl_signals.py
    broca/reasoning/rl_reward_logger.py
    broca/reasoning/rl_signal_estimators.py
    broca/reasoning/pattern_matcher.py
    broca/reasoning/pattern_match_logger.py
tests_dirs = tests broca/tests
runner = python -m pytest --maxfail=1 --disable-warnings --cov=broca --cov-branch
use_coverage = True

[coverage:run]
source = broca
branch = True
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
